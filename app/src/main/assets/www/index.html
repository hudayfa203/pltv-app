<!DOCTYPE html>
<html lang="so">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>PLTV</title>
<style>
:root{
  --navy:#041D4F; --navy2:#0A2C6B; --blue:#0758BD; --blue2:#0B76E7;
  --green:#0B8A2A; --green2:#15B91A; --red:#E3232D; --gold:#E7B52F;
  --bg:#F2F5FA; --card:#FFFFFF; --ink:#0E1E3D; --muted:#5D6B85; --line:#E3E9F2; --soft:#EAF0F8;
  --ui:system-ui,-apple-system,"Roboto","Segoe UI",sans-serif;
  --read:"Noto Serif","Source Serif Pro",Georgia,serif;
  --ease:cubic-bezier(.2,.8,.2,1);
  --top:env(safe-area-inset-top,0px); --bot:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root{--bg:#061127;--card:#0C1A38;--ink:#E7EDF8;--muted:#95A4C0;--line:#1B2B50;--soft:#102248}
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);line-height:1.45;
  -webkit-font-smoothing:antialiased;overflow:hidden;display:flex;flex-direction:column}
img{display:block;max-width:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:var(--blue2)}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- splash ---------- */
#splash{position:fixed;inset:0;z-index:100;background:radial-gradient(circle at 50% 38%,#0E3C8A,#041D4F 60%,#020B22);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;color:#fff;transition:opacity .45s var(--ease)}
#splash.gone{opacity:0;pointer-events:none}
#splash img{width:172px;height:172px;animation:pop .7s var(--ease) both}
@keyframes pop{from{opacity:0;transform:scale(.8)}}
#splash b{font-size:30px;letter-spacing:-.5px;font-weight:800}
#splash b i{font-style:normal;color:#4FD36A}
#splash small{opacity:.75;font-size:13px;margin-top:-14px}
.loader{width:120px;height:3px;border-radius:3px;background:#ffffff26;overflow:hidden}
.loader i{display:block;height:100%;width:40%;border-radius:3px;background:linear-gradient(90deg,var(--green2),var(--blue2));animation:ld 1.3s var(--ease) infinite}
@keyframes ld{0%{transform:translateX(-110%)}100%{transform:translateX(320%)}}
#splash .by{position:absolute;bottom:calc(22px + var(--bot));font-size:11px;opacity:.5}

/* ---------- app bar ---------- */
.bar{flex:none;padding-top:var(--top);background:var(--navy);color:#fff;z-index:20}
.bar-in{height:54px;display:flex;align-items:center;gap:10px;padding:0 12px}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.brand img{width:32px;height:32px}
.brand b{font-size:20px;font-weight:800;letter-spacing:-.6px}
.brand b i{font-style:normal;color:var(--green2)}
.bar .sp{flex:1}
.ic{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff}
.ic:active{background:#ffffff1f}
.bar h1{font-size:17px;font-weight:700;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- scroll area ---------- */
main{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.page{animation:fade .3s var(--ease)}
@keyframes fade{from{opacity:0;transform:translateY(8px)}}
.pad{padding:14px}
.gap{height:14px}

/* ---------- ticker ---------- */
.tick{display:flex;align-items:center;background:var(--card);border-bottom:1px solid var(--line);height:38px;overflow:hidden}
.tick b{flex:none;background:var(--red);color:#fff;font-size:11px;font-weight:800;padding:4px 9px;margin:0 10px;border-radius:5px}
.tick-t{flex:1;overflow:hidden;white-space:nowrap}
.tick-t span{display:inline-block;padding-left:100%;font-size:13px;font-weight:600;animation:tk 26s linear infinite}
@keyframes tk{to{transform:translateX(-100%)}}

/* ---------- live banner ---------- */
.livebar{margin:12px;border-radius:18px;background:linear-gradient(110deg,var(--red),#A3141C);color:#fff;
  padding:13px 15px;display:flex;align-items:center;gap:13px;width:calc(100% - 24px);text-align:start;
  box-shadow:0 12px 26px -14px rgba(227,35,45,.8)}
.livebar .lb{width:42px;height:42px;border-radius:50%;background:#ffffff2e;display:grid;place-items:center;position:relative}
.livebar .lb svg{fill:#fff;stroke:none;width:18px;height:18px}
.livebar .lb::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid #ffffff5c;animation:ring 2s var(--ease) infinite}
@keyframes ring{from{transform:scale(.85);opacity:1}to{transform:scale(1.3);opacity:0}}
.livebar div{flex:1;min-width:0}
.livebar b{display:block;font-size:14px;font-weight:800;letter-spacing:.3px}
.livebar small{font-size:12.5px;opacity:.9;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- cards ---------- */
.ph{background:linear-gradient(140deg,var(--c1,#0758BD),var(--c2,#041D4F));position:relative;overflow:hidden}
.ph::before{content:"";position:absolute;inset:0;background-image:radial-gradient(#ffffff26 1px,transparent 1.6px);background-size:9px 9px;
  -webkit-mask-image:linear-gradient(150deg,#000,transparent 72%)}
.ph .wm{position:absolute;right:8%;bottom:9%;width:30%;max-width:74px;opacity:.42}
.lead{margin:0 12px;border-radius:20px;overflow:hidden;background:var(--card);border:1px solid var(--line);
  width:calc(100% - 24px);text-align:start;display:block;box-shadow:0 14px 28px -22px rgba(4,29,79,.5)}
.lead .ph{aspect-ratio:16/10}
.lead .shade{position:absolute;inset:0;background:linear-gradient(transparent 35%,rgba(2,11,34,.92))}
.lead .cap{position:absolute;left:0;right:0;bottom:0;padding:14px;color:#fff}
.lead h3{font-size:18px;line-height:1.24;font-weight:800;letter-spacing:-.3px;margin:7px 0 5px}
.lead small{font-size:12px;opacity:.82}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;padding:4px 8px;border-radius:5px;background:var(--red);color:#fff}
.tag.b{background:var(--blue)} .tag.g{background:var(--green)}

.sec{display:flex;align-items:baseline;justify-content:space-between;padding:18px 14px 8px}
.sec h2{font-size:17px;font-weight:800;letter-spacing:-.3px;display:flex;align-items:center;gap:9px}
.sec h2::before{content:"";width:4px;height:17px;border-radius:2px;background:linear-gradient(var(--blue),var(--green2))}
.sec button{font-size:12.5px;font-weight:700;color:var(--blue2)}

.row{display:flex;gap:12px;padding:11px 14px;width:100%;text-align:start;align-items:flex-start;border-bottom:1px solid var(--line)}
.row:active{background:var(--soft)}
.row .ph{width:98px;height:76px;border-radius:14px;flex:none}
.row .tx{flex:1;min-width:0}
.row .ct{font-size:11px;font-weight:800;color:var(--green2);letter-spacing:.2px}
.row h4{font-size:14.5px;line-height:1.3;font-weight:700;margin:3px 0 5px;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.row small{font-size:11.5px;color:var(--muted)}

.ad{margin:14px;border-radius:16px;padding:16px;color:#fff;position:relative;overflow:hidden;background:var(--adc,#0B8A2A)}
.ad::after{content:"";position:absolute;right:-50px;top:-50px;width:170px;height:170px;border-radius:50%;background:#ffffff1f}
.ad .lbl{font-size:9.5px;font-weight:800;opacity:.75;letter-spacing:.8px}
.ad h4{font-size:16px;font-weight:800;margin:5px 0 3px;position:relative}
.ad p{font-size:13px;opacity:.9;position:relative}
.ad span{display:inline-block;margin-top:11px;background:#fff;color:#0E1E3D;font-size:12.5px;font-weight:800;padding:8px 14px;border-radius:9px;position:relative}

/* ---------- chips ---------- */
.chips{display:flex;gap:7px;overflow-x:auto;padding:12px 14px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 14px;border-radius:999px;font-size:12.5px;font-weight:700;background:var(--card);
  border:1px solid var(--line);color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}

.search{margin:12px 14px 0;display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--line);
  border-radius:13px;padding:0 13px;height:44px}
.search input{flex:1;min-width:0;border:0;outline:0;background:none;font-size:14px;color:var(--ink)}

/* ---------- article ---------- */
.art .ph{aspect-ratio:16/10}
.art .body{margin-top:-24px;position:relative;background:var(--bg);border-radius:24px 24px 0 0;padding:20px 18px 26px}
.art h1{font-size:23px;line-height:1.2;font-weight:800;letter-spacing:-.5px;margin:9px 0 10px}
.art .by{display:flex;align-items:center;gap:10px;padding-bottom:14px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}
.art .by img{width:32px;height:32px}
.art .lead-p{font-family:var(--read);font-size:17.5px;line-height:1.6;font-weight:600;margin-top:16px}
.art p.t{font-family:var(--read);font-size:17px;line-height:1.75;margin-top:15px}
.art .src{margin-top:20px;padding:13px 14px;border-radius:12px;background:var(--soft);font-size:12.5px;color:var(--muted)}
.sizer{display:flex;gap:7px;margin-top:14px}
.sizer button{padding:7px 13px;border-radius:9px;border:1px solid var(--line);background:var(--card);font-weight:800;font-size:13px}
.sizer button[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}

/* ---------- live ---------- */
.player{background:#000;position:relative;aspect-ratio:16/9;width:100%}
.player video{width:100%;height:100%;object-fit:contain;background:#000;display:block}
.cover{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#0E3C8A,#020B22 72%);transition:opacity .3s}
.cover.hide{opacity:0;pointer-events:none}
.cover img{position:absolute;width:44%;max-width:150px;opacity:.16}
.play{width:76px;height:76px;border-radius:50%;background:var(--red);display:grid;place-items:center;position:relative;
  box-shadow:0 14px 34px -10px rgba(227,35,45,.85)}
.play svg{fill:#fff;stroke:none;width:30px;height:30px;margin-inline-start:4px}
.play::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:2px solid #ffffff4d;animation:ring 2.2s var(--ease) infinite}
.badge{position:absolute;top:10px;inset-inline-start:10px;display:flex;gap:7px;z-index:3}
.dot{display:inline-flex;align-items:center;gap:5px;background:var(--red);color:#fff;font-size:10.5px;font-weight:800;padding:4px 8px;border-radius:5px}
.dot::before{content:"";width:6px;height:6px;border-radius:50%;background:#fff;animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.25}}
.chipd{background:rgba(0,0,0,.55);color:#fff;font-size:10.5px;font-weight:700;padding:4px 8px;border-radius:5px}
.pstat{padding:11px 14px;font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:800;font-size:13.5px;
  padding:11px 17px;border-radius:12px;transition:transform .15s var(--ease)}
.btn:active{transform:scale(.97)}
.btn-r{background:var(--red);color:#fff}
.btn-b{background:var(--blue);color:#fff}
.btn-g{background:var(--green);color:#fff}
.btn-o{background:var(--soft);color:var(--ink);border:1px solid var(--line)}

.now{margin:12px;padding:14px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.now .k{font-size:11px;font-weight:800;color:var(--red)}
.now b{display:block;font-size:16px;font-weight:800;margin:3px 0 2px}
.now small{color:var(--muted);font-size:12.5px}
.now .pr{height:4px;border-radius:4px;background:var(--soft);margin-top:11px;overflow:hidden}
.now .pr i{display:block;height:100%;background:var(--green2)}
.sched{margin:0 14px}
.sched li{list-style:none;display:grid;grid-template-columns:52px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center}
.sched li:last-child{border:0}
.sched time{font-weight:800;font-size:13px;color:var(--blue2)}
.sched li.on time{color:var(--red)}
.sched b{display:block;font-size:14px;font-weight:700}
.sched small{color:var(--muted);font-size:12px}

/* ---------- radio ---------- */
.radio{padding:26px 18px calc(18px + var(--bot));text-align:center;background:linear-gradient(170deg,var(--navy),#061534);color:#fff;min-height:100%}
.disc{width:210px;height:210px;margin:6px auto 0;border-radius:50%;display:grid;place-items:center;position:relative}
.disc img{width:168px;height:168px;position:relative;z-index:1}
.disc::before,.disc::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid #ffffff2e}
.disc::after{inset:-22px;border-color:#ffffff17}
.radio.on .disc::before{animation:ring 2.4s var(--ease) infinite}
.radio h2{font-size:22px;font-weight:800;margin-top:22px}
.radio .sub{opacity:.75;font-size:13px;margin-top:5px}
.wave{display:flex;align-items:flex-end;justify-content:center;gap:3px;height:34px;margin-top:18px}
.wave i{width:3px;border-radius:3px;background:var(--green2);height:7px}
.radio.on .wave i{animation:wv 1s var(--ease) infinite}
.wave i:nth-child(3n){animation-delay:-.3s}.wave i:nth-child(3n+1){animation-delay:-.6s}.wave i:nth-child(4n){animation-delay:-.15s}
@keyframes wv{50%{height:30px}}
.radio .big{width:72px;height:72px;border-radius:50%;background:var(--green);display:grid;place-items:center;margin:20px auto 0;
  box-shadow:0 14px 30px -10px rgba(11,138,42,.9)}
.radio .big svg{fill:#fff;stroke:none;width:28px;height:28px}
.notice{margin:18px 0 0;padding:13px;border-radius:13px;background:#ffffff14;border:1px solid #ffffff21;font-size:12.5px;opacity:.9}

/* ---------- chat ---------- */
.msg{display:flex;gap:9px;padding:9px 14px}
.msg .av{width:32px;height:32px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px}
.msg .bub{background:var(--card);border:1px solid var(--line);border-radius:5px 15px 15px 15px;padding:9px 12px;font-size:13.5px}
.msg .bub b{font-size:12px;color:var(--blue2);display:block;margin-bottom:2px}
.empty{padding:40px 24px;text-align:center;color:var(--muted);font-size:13.5px}
.empty img{width:86px;height:86px;margin:0 auto 14px;opacity:.35}

/* ---------- sheet ---------- */
.sheet-bg{position:fixed;inset:0;background:rgba(2,11,34,.6);z-index:60;display:flex;align-items:flex-end;animation:fade .25s}
.sheet{width:100%;background:var(--bg);border-radius:22px 22px 0 0;padding:8px 0 calc(16px + var(--bot));
  max-height:86vh;overflow-y:auto;animation:up .32s var(--ease)}
@keyframes up{from{transform:translateY(100%)}}
.grab{width:42px;height:4px;border-radius:4px;background:var(--line);margin:8px auto 14px}
.sheet h3{font-size:17px;font-weight:800;padding:0 18px 12px}
.opt{display:flex;align-items:center;gap:13px;padding:14px 18px;width:100%;text-align:start;border-top:1px solid var(--line)}
.opt .tx{flex:1;min-width:0}
.opt b{display:block;font-size:14.5px;font-weight:700}
.opt small{font-size:12.5px;color:var(--muted)}
.segs{display:flex;gap:7px;padding:4px 18px 14px}
.segs button{flex:1;padding:10px;border-radius:11px;border:1px solid var(--line);background:var(--card);font-weight:800;font-size:13px}
.segs button[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
.about{padding:16px 18px;font-size:12.5px;color:var(--muted);line-height:1.7;border-top:1px solid var(--line)}
.about b{color:var(--ink)}

/* ---------- bottom nav ---------- */
nav{flex:none;display:flex;justify-content:space-around;align-items:flex-end;background:var(--card);
  border-top:1px solid var(--line);padding:7px 4px calc(7px + var(--bot));z-index:20}
nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:700;
  color:var(--muted);width:60px;padding-top:3px}
nav button[aria-current="page"]{color:var(--blue2)}
nav .mid{width:52px;height:52px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;
  margin-top:-24px;box-shadow:0 0 0 5px var(--card),0 10px 20px -8px rgba(227,35,45,.75)}
nav button[aria-current="page"] .mid{background:var(--red)}

.toast{position:fixed;left:50%;bottom:calc(86px + var(--bot));transform:translateX(-50%);background:#0E1E3D;color:#fff;
  padding:11px 17px;border-radius:12px;font-size:13px;font-weight:700;z-index:90;animation:fade .25s;max-width:86%;text-align:center}
[dir="rtl"] .row,[dir="rtl"] .livebar{text-align:right}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>

<script>
(function(){
"use strict";

/* ================= state ================= */
var S={tab:"home",article:null,cat:"all",q:"",lang:"so",fs:1,data:null,sheet:null,
       playing:false,radio:false,hls:null,toastT:0};
var $=function(s,r){return (r||document).querySelector(s)};
var esc=function(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})};
var ic=function(n,c){return '<svg class="'+(c||"i")+'"><use href="#i-'+n+'"/></svg>'};

/* ================= i18n ================= */
var L={

var T=function(k){var i={so:0,en:1,ar:2}[S.lang]||0;return (L[k]||[k])[i]||(L[k]||[k])[0]};
var CATS=["puntland","somalia","world","politics","elections","society","economy","sports"];
var CC={puntland:["#0758BD","#041D4F"],somalia:["#0070A8","#06335A"],world:["#3D4FA8","#16205A"],
        politics:["#6A3FB5","#2A1860"],elections:["#0B8A2A","#063F18"],society:["#C2410C","#5A1D06"],
        economy:["#B7791F","#4F3308"],sports:["#E3232D","#5E0B10"]};

var SOM=["Janaayo","Febraayo","Maarso","Abriil","Maajo","Juun","Luulyo","Agoosto","Sebtembar","Oktoobar","Nofembar","Desembar"];
function fmtDate(s){
  if(!s) return "";
  var d=new Date(s+"T00:00:00");
  if(isNaN(d)) return s;
  if(S.lang==="so") return d.getDate()+" "+SOM[d.getMonth()]+" "+d.getFullYear();
  try{return d.toLocaleDateString(S.lang==="ar"?"ar":"en-GB",{day:"numeric",month:"long",year:"numeric"})}
  catch(e){return s}
}

/* ================= helpers ================= */
function ph(n,extra){
  var c=CC[n&&n.category]||CC.puntland;
  return '<div class="ph '+(extra||"")+'" style="--c1:'+c[0]+';--c2:'+c[1]+'">'+
         '<img class="wm" src="img/seal-sm.webp" alt=""></div>';
}
function news(){return (S.data&&S.data.news||[]).slice().sort(function(a,b){
  return (b.date||"").localeCompare(a.date||"")})}
function set_(){return (S.data&&S.data.settings)||{}}
function toast(m){
  var t=$("#toast"); if(t) t.remove();
  var d=document.createElement("div"); d.className="toast"; d.id="toast"; d.textContent=m;
  document.body.appendChild(d);
  clearTimeout(S.toastT); S.toastT=setTimeout(function(){d.remove()},2600);
}
function curShow(){
  var sc=set_().schedule||[],d=new Date(),m=d.getHours()*60+d.getMinutes(),idx=-1;
  sc.forEach(function(x,i){var p=String(x.t).split(":");if(+p[0]*60+ +p[1]<=m) idx=i});
  return idx<0?(sc.length?sc.length-1:-1):idx;
}

/* ================= render ================= */
function render(){
  document.documentElement.lang=S.lang==="so"?"so":S.lang;
  document.documentElement.dir=S.lang==="ar"?"rtl":"ltr";
  $("#bar").innerHTML=barHTML();
  $("#nav").innerHTML=navHTML();
  var m=$("#main");
  var html = S.article?articleHTML()
    : S.tab==="home"?homeHTML()
    : S.tab==="news"?newsHTML()
    : S.tab==="live"?liveHTML()
    : S.tab==="radio"?radioHTML() : chatHTML();
  m.innerHTML=html;
  m.scrollTop=0;
  if(S.tab==="live"&&!S.article&&S.playing) restorePlayer();
}

/* ================= live player ================= */
function startLive(){
  var s=set_(), url=(s.liveUrl||"").trim();
  var v=$("#vid"), cover=$("#cover"), stat=$("#pstat span");
  if(!v) return;
  if(!url){ fail(); return; }
  cover.classList.add("hide"); stat.textContent=T("connecting"); S.playing=true;
  var ok=function(){ stat.textContent="● "+T("onair"); };
  if(S.hls){ try{S.hls.destroy()}catch(e){} S.hls=null; }
  if(window.Hls&&Hls.isSupported()){
    var h=new Hls({lowLatencyMode:true,enableWorker:true}); S.hls=h;
    h.loadSource(url); h.attachMedia(v);
    h.on(Hls.Events.MANIFEST_PARSED,function(){ v.play().then(ok).catch(function(){stat.textContent=T("press")}) });
    h.on(Hls.Events.ERROR,function(e,d){ if(d&&d.fatal){ try{h.destroy()}catch(x){} S.hls=null; fail(); } });
  } else if(v.canPlayType("application/vnd.apple.mpegurl")){
    v.src=url; v.play().then(ok).catch(fail);
  } else fail();
  function fail(){
    S.playing=false;
    if(cover) cover.classList.remove("hide");
    var p=$("#pstat");
    if(p) p.innerHTML=ic("info")+'<span>'+esc(T("failed"))+'</span>'+
      '<a class="btn btn-o" style="padding:7px 11px;font-size:12px;margin-inline-start:auto" href="'+
      esc(s.youtubeUrl||s.officialUrl||"https://statetvradio.pl.so/")+'">'+ic("ext")+esc(T("openyt"))+'</a>';
  }
}
function restorePlayer(){ /* player is recreated on tab change; keep it simple and restart */
  var c=$("#cover"); if(c) startLive();
}
function stopLive(){
  if(S.hls){ try{S.hls.destroy()}catch(e){} S.hls=null; }
  var v=$("#vid"); if(v){ try{v.pause()}catch(e){} v.removeAttribute("src"); try{v.load()}catch(e){} }
  S.playing=false;
}

/* ================= radio ================= */
function toggleRadio(){
  var a=$("#aud"), url=(set_().radioUrl||"").trim();
  if(!a||!url) return;
  if(S.radio){ a.pause(); S.radio=false; }
  else{ a.src=url; a.play().then(function(){S.radio=true;render()}).catch(function(){toast(T("failed"))}); S.radio=true; }
  render();
}

function closeSheet(){var s=$("#sheet"); if(s) s.remove(); S.sheet=null}

/* ================= navigation ================= */
function go(state,replace){
  var st={tab:S.tab,article:S.article,cat:S.cat};
  if(replace) history.replaceState(st,""); else history.pushState(st,"");
}
function setTab(t){
  if(S.tab==="live"&&t!=="live") stopLive();
  if(S.tab==="radio"&&t!=="radio"&&S.radio){var a=$("#aud");if(a)a.pause();S.radio=false}
  S.tab=t; S.article=null; go(); render();
}
function openArticle(id){ S.article=id; go(); render(); }

window.addEventListener("popstate",function(e){
  if(S.sheet){ closeSheet(); go(); return; }
  var st=e.state;
  if(st){ if(S.tab==="live"&&st.tab!=="live") stopLive();
          S.tab=st.tab; S.article=st.article; S.cat=st.cat||S.cat; render(); }
});

/* ================= events ================= */
document.addEventListener("click",function(ev){
  var t=ev.target.closest("[data-act],[data-tab],[data-open],[data-cat],[data-lang],[data-fs]");
  if(!t){ if(ev.target.closest(".sheet-bg")&&!ev.target.closest(".sheet")) closeSheet(); return; }
  var d=t.dataset;
  if(d.tab){ closeSheet(); setTab(d.tab); return; }
  if(d.open){ closeSheet(); openArticle(d.open); return; }
  if(d.cat){ S.cat=d.cat; render(); return; }
  if(d.lang){ S.lang=d.lang; save(); closeSheet(); render(); return; }
  if(d.fs!==undefined){ S.fs=+d.fs; save(); closeSheet(); render(); return; }
  switch(d.act){
    case "back": history.back(); break;
    case "menu": openSheet("menu"); break;
    case "size": openSheet("size"); break;
    case "play": startLive(); break;
    case "radio": toggleRadio(); break;
    case "refresh": closeSheet(); refresh(); break;
  }
});
document.addEventListener("input",function(ev){
  if(ev.target.id==="q"){ S.q=ev.target.value;
    var m=$("#main"), sc=m.scrollTop; render(); m.scrollTop=sc;
    var q=$("#q"); if(q){ q.focus(); q.setSelectionRange(q.value.length,q.value.length); } }
});

/* ================= storage & data ================= */
function save(){ try{ localStorage.setItem("pltv",JSON.stringify({lang:S.lang,fs:S.fs})) }catch(e){} }
function load(){ try{ var o=JSON.parse(localStorage.getItem("pltv")||"{}");
  if(o.lang) S.lang=o.lang; if(typeof o.fs==="number") S.fs=o.fs; }catch(e){} }

function refresh(){
  var url=(set_().remoteUrl||"").trim();
  if(!url){ toast(T("noupdate")); return; }
  fetch(url,{cache:"no-store"}).then(function(r){return r.json()}).then(function(j){
    if(j&&j.news){ S.data=j; try{localStorage.setItem("pltv_data",JSON.stringify(j))}catch(e){}
      render(); toast(T("updated")); }
  }).catch(function(){ toast(T("noupdate")) });
}

function boot(){
  load();
  var done=function(data){
    S.data=data;
    render();
    history.replaceState({tab:S.tab,article:null,cat:S.cat},"");
    setTimeout(function(){ var s=$("#splash"); if(s){ s.classList.add("gone");
      setTimeout(function(){s.remove()},500); } },650);
    var rm=(set_().remoteUrl||"").trim();
    if(rm) setTimeout(function(){ fetch(rm,{cache:"no-store"}).then(function(r){return r.json()})
      .then(function(j){ if(j&&j.news){ S.data=j; render(); } }).catch(function(){}) },1200);
  };
  var cached=null;
  try{ cached=JSON.parse(localStorage.getItem("pltv_data")||"null") }catch(e){}
  fetch("data/content.json",{cache:"no-store"}).then(function(r){return r.json()})
    .then(function(j){ done(cached&&cached.version>j.version?cached:j) })
    .catch(function(){ done(cached||{settings:{},news:[],ads:[],chat:[]}) });
}
boot();
})();
</script>
</body>
</html>
