plugins {
    id "com.android.application"
}

android {
    namespace "so.pl.pltv"
    compileSdk 34

    defaultConfig {
        applicationId "so.pl.pltv"
        minSdk 23
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    // Release signing uses release.keystore when CI decodes it from the
    // repository secrets. Without it the release build falls back to the
    // debug key, so a build always produces an installable APK.
    def ksFile = rootProject.file("release.keystore")

    signingConfigs {
        release {
            if (ksFile.exists()) {
                storeFile ksFile
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig ksFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

dependencies {
}
