name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the project
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Report the toolchain
        run: |
          echo "::notice title=SDK::ANDROID_HOME=${ANDROID_HOME:-unset} SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          echo "::notice title=Platforms::$(ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platforms" 2>&1 | tr '\n' ' ')"
          echo "::notice title=Java::$(java -version 2>&1 | head -1)"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore the signing key (when configured)
        if: env.KEYSTORE_B64 != ''
        run: echo "$KEYSTORE_B64" | base64 -d > release.keystore

      - name: Build the release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace clean assembleRelease 2>&1 | tee build.log

      - name: Report the failure
        if: failure()
        run: |
          tail -n 40 build.log 2>/dev/null | while IFS= read -r line; do
            echo "::error title=Build::${line}"
          done

      - name: Name the APK
        id: apk
        run: |
          VERSION=$(grep -oP 'versionName "\K[^"]+' app/build.gradle)
          NAME="PLTV-v${VERSION}-build${{ github.run_number }}.apk"
          mkdir -p out
          cp app/build/outputs/apk/release/app-release*.apk "out/${NAME}"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          ls -la out

      - name: Upload the APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PLTV-apk
          path: out/*.apk
          retention-days: 90

      - name: Publish the APK to Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.apk.outputs.version }}-build${{ github.run_number }}"
          NOTES="PLTV - Puntland State TV & Radio. Soo deji APK-ga hoose, kadibna ku rakib telefoonkaaga Android. Designed & built by Hudayfi Mohamed Isse - Somali Digital."
          gh release create "$TAG" "out/${{ steps.apk.outputs.name }}" \
            --title "PLTV ${{ steps.apk.outputs.version }} (build ${{ github.run_number }})" \
            --notes "$NOTES"
